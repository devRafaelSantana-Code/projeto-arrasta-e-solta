<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Desafio Drag and Drop Premium</title>
      <link rel="stylesheet" href="./style.css" />
   </head>
   <body>
      <div class="container">
         <h1>Desafio de Ordenação</h1>

         <!-- Área Neutra com 5 caixas -->
         <div class="neutralArea">
            <div class="item" draggable="true">1</div>
            <div class="item" draggable="true">2</div>
            <div class="item" draggable="true">3</div>
            <div class="item" draggable="true">4</div>
            <div class="item" draggable="true">5</div>
         </div>

         <!-- 5 Áreas de Drop  -->
         <div class="areas">
            <div class="area" data-name="a"></div>
            <div class="area" data-name="b"></div>
            <div class="area" data-name="c"></div>
            <div class="area" data-name="d"></div>
            <div class="area" data-name="e"></div>
         </div>

         <!-- Botão para Reiniciar e Embaralhar -->
         <button id="resetBtn" class="btn-premium">Embaralhar Jogo</button>
      </div>

      <footer>Criado por Dev. Rafael Santana</footer>

      <script src="./script.js"></script>
   </body>
</html>
